# Echter Probelauf: lädt das Modell von Hugging Face, startet Max und stellt ein paar feste Fragen.
# Nur von Hand starten (Actions → Selbsttest → Run workflow).
name: Selbsttest

on:
  workflow_dispatch:
    inputs:
      os:
        description: System (Windows findet z. B. Fehler bei der Zeichenkodierung)
        type: choice
        options: [ubuntu-latest, windows-latest]
        default: ubuntu-latest
      exe:
        description: Als einzelne Datei bauen und die testen (wie beim Release)
        type: boolean
        default: false

jobs:
  selftest:
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 70
    env:
      MAX_HOME: ${{ github.workspace }}/.maxhome
      # Die Test-Rechner auf GitHub haben keine Grafikkarte.
      MAX_CPU: 1
      DOTNET_NOLOGO: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test

      # Das Modell nicht bei jedem Lauf neu laden – der Schlüssel ändert sich nur mit dem Modell-Eintrag
      # im Manifest (nicht mit der App-Version, die der Release-Workflow einträgt).
      - name: Modell-Schlüssel
        id: model
        run: echo "key=$(jq -c .model manifest.json | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .maxhome
          key: model-${{ runner.os }}-${{ steps.model.outputs.key }}

      - name: Selbsttest
        run: |
          if [ "${{ inputs.exe }}" = "true" ]; then
            rid=$([ "$RUNNER_OS" = "Windows" ] && echo win-x64 || echo linux-x64)
            dotnet publish src/Max -c Release -r $rid -o out
            ls -la out
            ./out/max --selftest < /dev/null
          else
            dotnet run --project src/Max -c Release -- --selftest < /dev/null
          fi

      - name: Protokoll von llama.cpp
        if: always()
        run: tail -n 60 .maxhome/logs/llama.log || true

      # Die getestete Datei zum Herunterladen (Actions → Lauf → Artifacts), z. B. für den Test auf einem Rechner mit Grafikkarte.
      - uses: actions/upload-artifact@v4
        if: inputs.exe
        with:
          name: max-${{ runner.os }}
          path: out/max*
          retention-days: 14
